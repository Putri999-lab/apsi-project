services:
  db:
    image: postgres:16
    container_name: apsi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: ${POSTGRES_DB:-apsi_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-apsi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apsi-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in root .env}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in root .env}
      EMPLOYEE_REGISTRATION_CODE: ${EMPLOYEE_REGISTRATION_CODE:-}
      OWNER_REGISTRATION_CODE: ${OWNER_REGISTRATION_CODE:-}
      ADMIN_REGISTRATION_CODE: ${ADMIN_REGISTRATION_CODE:-}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
