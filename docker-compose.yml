services:
  db:
    image: postgres:16
    container_name: apsi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PasswordKita123
      POSTGRES_DB: apsi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apsi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apsi-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:PasswordKita123@db:5432/apsi_db?schema=public
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
